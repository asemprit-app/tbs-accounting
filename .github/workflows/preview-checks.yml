name: Preview checks
on:
  push:
    branches: [tbs-control-center]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Temporary until a committed package-lock.json is generated and npm ci can be used.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/*.test.mjs
